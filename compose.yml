services:
  jupyter:
    build: .
    container_name: my-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app  # Mount current folder into the container
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --allow-root
      --no-browser
    environment:
      - JUPYTER_TOKEN=forviaproject

